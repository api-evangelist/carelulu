aid: carelulu
name: CareLuLu
description: CareLuLu is a consumer marketplace that helps parents find and compare licensed child
  care — home daycares, child care centers, and preschools. Families can search across roughly 200,000
  licensed programs and filter by location, age, hours, tuition, and availability, then view photos,
  verified parent reviews, and schedule tours or consultations. The service is positioned as an easy,
  fast, and free way to find safe, high-quality, affordable child care, and it also lets providers
  list and market their programs to local parents. Backed by 500 Global. Note — CareLuLu runs a
  consumer web application (an AMP/React SPA) and an internal API host (api.carelulu.com), but does
  not publish a public developer API, documentation, or SDKs — this profile captures its public
  website and identity surface only.
